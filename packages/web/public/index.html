<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SketchForge 底座 · 参考客户端</title>
<style>
  :root {
    --bg: #fbfbfd; --panel: #fff; --border: #e2e4e9; --text: #1c1e24;
    --muted: #6b7280; --accent: #2563eb; --ok: #059669; --err: #dc2626; --warn: #d97706;
    --mono: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d; --panel: #1d2027; --border: #2e323b; --text: #e6e8ec;
      --muted: #9aa1ad; --accent: #60a5fa; --ok: #34d399; --err: #f87171; --warn: #fbbf24;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
    flex: 0 0 auto; position: relative;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; }
  header .sep { flex: 1; }
  select, button {
    font: inherit; padding: 6px 12px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer;
  }
  #board-config { position: static; }
  #board-config > summary {
    list-style: none; padding: 6px 12px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--panel); cursor: pointer; user-select: none;
  }
  #board-config > summary::-webkit-details-marker { display: none; }
  #board-config[open] > summary { border-color: var(--accent); }
  #board-options {
    position: absolute; z-index: 10; top: calc(100% + 8px); right: 16px;
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;
    width: min(620px, calc(100vw - 32px)); max-height: min(560px, 70vh); overflow: auto;
    padding: 12px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--panel); box-shadow: 0 10px 24px rgb(0 0 0 / 18%);
  }
  .board-option { display: grid; gap: 4px; min-width: 0; font-size: 12px; }
  .board-option > span { color: var(--muted); overflow-wrap: anywhere; }
  .board-option select { width: 100%; min-width: 0; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary.cancel { background: var(--err); border-color: var(--err); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 0; flex: 1; min-height: 0; }
  @media (max-width: 900px) {
    body { height: auto; min-height: 100%; }
    main { grid-template-columns: 1fr; flex: none; }
    .editor { height: 320px; border-right: 0; border-bottom: 1px solid var(--border); }
  }
  @media (max-width: 600px) {
    #board-options { left: 16px; right: 16px; width: auto; grid-template-columns: minmax(0, 1fr); }
  }

  /* ---- 编辑器：行号槽 + textarea 严格对齐 ---- */
  .editor { display: flex; overflow: hidden; border-right: 1px solid var(--border); background: var(--panel); }
  .gutter {
    padding: 12px 8px 12px 12px; text-align: right; user-select: none;
    font: 13px/21px var(--mono); color: var(--muted);
    background: var(--bg); border-right: 1px solid var(--border); overflow: hidden; min-width: 52px;
  }
  .gutter div { white-space: pre; }
  .gutter div.has-error { color: var(--err); font-weight: 700; }
  .gutter div.has-warn  { color: var(--warn); font-weight: 700; }
  textarea#code {
    flex: 1; border: 0; outline: 0; resize: none; padding: 12px;
    font: 13px/21px var(--mono); background: var(--panel); color: var(--text);
    tab-size: 2; white-space: pre; overflow-wrap: normal; overflow-x: auto;
  }

  aside { display: flex; flex-direction: column; overflow: hidden; background: var(--panel); }
  .section { border-bottom: 1px solid var(--border); padding: 10px 14px; }
  .section h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 0 0 8px;
  }
  .status-progress { display: flex; align-items: center; gap: 10px; min-height: 44px; }
  .status { min-width: 0; font-size: 13px; overflow-wrap: anywhere; }
  .progress-ring {
    position: relative; flex: 0 0 44px; width: 44px; height: 44px;
    color: var(--accent);
  }
  .progress-ring svg { display: block; width: 100%; height: 100%; transform: rotate(-90deg); }
  .progress-ring circle { fill: none; stroke-width: 4; }
  .progress-ring-track { stroke: var(--border); }
  .progress-ring-value {
    stroke: currentColor; stroke-linecap: round; stroke-dasharray: 113.097;
    stroke-dashoffset: 113.097; transition: stroke-dashoffset .15s ease;
  }
  .progress-ring-label {
    position: absolute; inset: 0; display: grid; place-items: center;
    font: 10px/1 var(--mono); color: var(--muted); pointer-events: none;
  }

  .mem { display: grid; gap: 6px; font: 12px/1.4 var(--mono); }
  .mem .row { display: grid; grid-template-columns: 46px 1fr auto; gap: 8px; align-items: center; }
  .mem .track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .mem .track > i { display: block; height: 100%; background: var(--ok); }
  .mem .track > i.high { background: var(--warn); }
  .mem .track > i.full { background: var(--err); }

  #diags { flex: 1; overflow-y: auto; padding: 6px 0; min-height: 120px; }
  .diag {
    padding: 7px 14px; border-left: 3px solid transparent; cursor: pointer; font-size: 13px;
  }
  .diag:hover { background: var(--bg); }
  .diag.error { border-left-color: var(--err); }
  .diag.warning { border-left-color: var(--warn); }
  .diag.info { border-left-color: var(--muted); }
  .diag .loc { font: 11px var(--mono); color: var(--muted); }
  .diag .tag {
    display: inline-block; font-size: 10px; padding: 0 5px; border-radius: 3px;
    background: var(--border); color: var(--muted); margin-left: 6px;
  }
  .empty { color: var(--muted); padding: 14px; font-size: 13px; }

  #monitor {
    height: 150px; overflow-y: auto; margin: 0; padding: 10px 14px;
    font: 12px/1.55 var(--mono); background: var(--bg); white-space: pre-wrap; word-break: break-all;
  }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .project-section-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
  .project-section-heading h2 { margin: 0; }
  .project-section-heading button { padding: 3px 7px; font-size: 11px; }
  .project-file-editor { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 5px; margin-bottom: 7px; }
  .project-file-editor[hidden] { display: none; }
  .project-file-editor input { min-width: 0; width: 100%; padding: 4px 6px; border: 1px solid var(--border); border-radius: 5px; background: var(--panel); color: var(--text); font: 11px var(--mono); }
  .project-file-editor button { padding: 3px 7px; font-size: 11px; }
  .project-files { display: grid; gap: 4px; max-height: 180px; overflow: auto; }
  .project-file { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 5px; align-items: center; }
  .project-file button { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; padding: 4px 7px; }
  .project-file button.active { border-color: var(--accent); color: var(--accent); }
  .project-file .rename { padding: 3px 6px; font-size: 10px; }
  .project-file .remove { padding: 3px 7px; color: var(--err); }
  .artifact-list { display: grid; gap: 5px; }
  .artifact-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
  .artifact-row span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 11px var(--mono); }
  .artifact-row button { padding: 3px 7px; font-size: 11px; }
  #project-id { width: 110px; min-width: 0; }
  .library-section { max-height: 360px; overflow: hidden; }
  #library-filter { width: 100%; margin-bottom: 7px; }
  .library-import-form {
    display: grid; grid-template-columns: minmax(120px, 1fr) minmax(64px, 84px) auto;
    gap: 5px; align-items: center; margin-bottom: 3px;
  }
  .library-import-form input, #library-filter {
    min-width: 0; width: 100%; padding: 5px 7px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--panel); color: var(--text); font: inherit;
  }
  .library-import-form button { min-width: 50px; padding: 5px 8px; }
  .library-import-status {
    min-height: 18px; max-height: 48px; margin-bottom: 3px; overflow: auto; color: var(--muted);
    font-size: 11px; line-height: 16px; overflow-wrap: anywhere;
  }
  .library-import-status[data-state="success"] { color: var(--ok); }
  .library-import-status[data-state="error"] { color: var(--err); }
  .library-import-status[data-state="busy"] { color: var(--accent); }
  #library-list { display: grid; gap: 3px; max-height: 205px; overflow: auto; }
  .library-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px; align-items: center; font-size: 12px; }
  .library-row label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .library-row small { color: var(--muted); }
  .library-row button { padding: 2px 6px; font-size: 11px; }
  code { font-family: var(--mono); background: var(--bg); padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>

<header>
  <h1>SketchForge <span style="color:var(--muted);font-weight:400">底座参考客户端</span></h1>
  <select id="board"></select>
  <button id="btn-import-project" type="button" title="Import a project folder">Import folder</button>
  <button id="btn-add-files" type="button" title="Add source files to the project">Add files</button>
  <button id="btn-import-archive" type="button" title="导入 SketchForge 项目文件">导入项目</button>
  <button id="btn-export-project" type="button" title="导出 SketchForge 项目文件">导出项目</button>
  <input id="project-folder-input" type="file" webkitdirectory directory multiple hidden>
  <input id="project-files-input" type="file" multiple hidden accept=".ino,.c,.cc,.cpp,.cxx,.S,.s,.asm,.h,.hh,.hpp,.hxx">
  <input id="project-archive-input" type="file" hidden accept=".json,.sketchforge.json,application/json">
  <input id="project-id" value="default" aria-label="云项目名称" spellcheck="false">
  <button id="btn-cloud-save" type="button" title="保存到云端">云保存</button>
  <button id="btn-cloud-load" type="button" title="从云端恢复">云恢复</button>
  <details id="board-config">
    <summary>配置</summary>
    <div id="board-options"></div>
  </details>
  <button class="primary" id="btn-compile">编译</button>
  <button id="btn-flash" disabled>烧录到板子</button>
  <span class="sep"></span>
  <button id="btn-monitor">串口监视器</button>
</header>

<main>
  <div class="editor">
    <div class="gutter" id="gutter"></div>
    <textarea id="code" spellcheck="false"></textarea>
  </div>

  <aside>
    <div class="section">
      <div class="project-section-heading">
        <h2>Project files</h2>
        <button id="btn-new-file" type="button" title="Create project file">New</button>
      </div>
      <form id="project-file-editor" class="project-file-editor" hidden>
        <input id="project-file-name" maxlength="160" autocomplete="off" autocapitalize="none" spellcheck="false" required>
        <button type="submit">Save</button>
        <button id="btn-cancel-file-edit" type="button">Cancel</button>
      </form>
      <div id="project-files" class="project-files"></div>
    </div>

    <div class="section library-section">
      <h2>Library registry</h2>
      <input id="library-filter" type="search" placeholder="搜索库名称" aria-label="搜索库名称">
      <form id="library-import-form" class="library-import-form" aria-busy="false" novalidate>
        <input id="library-repository" name="repository" maxlength="512" required
               placeholder="owner/repo 或 GitHub URL" aria-label="GitHub 仓库"
               autocomplete="off" autocapitalize="none" spellcheck="false">
        <input id="library-ref" name="ref" maxlength="150" placeholder="ref（可选）"
               aria-label="GitHub ref，可选" autocomplete="off" autocapitalize="none" spellcheck="false">
        <button type="submit" title="从 GitHub 导入 Arduino 库">导入</button>
      </form>
      <div id="library-import-status" class="library-import-status" role="status" aria-live="polite"></div>
      <div id="library-list"><div class="empty">正在加载库目录…</div></div>
    </div>

    <div class="section">
      <h2>状态</h2>
      <div class="status-progress">
        <div class="progress-ring" id="progress-ring" role="progressbar"
             aria-label="编译进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <svg viewBox="0 0 40 40" aria-hidden="true" focusable="false">
            <circle class="progress-ring-track" cx="20" cy="20" r="18"></circle>
            <circle class="progress-ring-value" id="progress" cx="20" cy="20" r="18"></circle>
          </svg>
          <span class="progress-ring-label" id="progress-value">0%</span>
        </div>
        <div class="status" id="status" role="status" aria-live="polite">就绪</div>
      </div>
    </div>

    <div class="section" id="mem-section" style="display:none">
      <h2>资源占用</h2>
      <div class="mem" id="mem"></div>
    </div>

    <div class="section" id="artifact-section" hidden>
      <h2>固件下载</h2>
      <div id="artifact-downloads" class="artifact-list"></div>
    </div>

    <div class="section" style="flex:1;display:flex;flex-direction:column;overflow:hidden;padding:0">
      <h2 style="padding:10px 14px 0">诊断</h2>
      <div id="diags"><div class="empty">还没有编译过</div></div>
    </div>

    <div class="section" style="padding:0">
      <h2 style="padding:10px 14px 0">串口输出</h2>
      <pre id="monitor">未连接。点击「串口监视器」开始接收。</pre>
    </div>
  </aside>
</main>

<script src="./toolchain-origins.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
