name: sketchforge

x-common-env: &common-env
  # The base file is a local/pre-production entrypoint. Production trust is
  # enabled only by compose.distributed.production.yml.
  NODE_ENV: development
  AF_REDIS_URL: redis://redis:6379/0
  AF_QUEUE_PREFIX: sketchforge-compile
  # The same immutable identity is also passed as a Docker build arg for a
  # prewarmed image. Keep both sides configurable through one value so a
  # correctly built seed is not rejected at worker startup.
  AF_COMPILER_BUNDLE_ID: "${AF_COMPILER_BUNDLE_ID:-sketchforge-production-v2}"
  # Local Compose is explicitly unverified. The production override replaces
  # both values with a canonical, accepted runtime release.
  AF_COMPILE_RELEASE_ID: "${AF_COMPILE_RELEASE_ID:-unverified-local}"
  AF_COMPILER_RUNTIME_RELEASE_PATH: "${AF_COMPILER_RUNTIME_RELEASE_PATH:-}"
  AF_ARTIFACT_DIR: /var/afartifacts
  # Runtime library imports use one filesystem store. This named volume is
  # shared only by services in this single-host Compose project: gateway is
  # the sole writer and workers mount the same bytes read-only.
  AF_LIBRARY_STORE_DIR: /var/aflibraries
  # Local volume is the single-host default. A split gateway/worker deployment
  # must set the same S3-compatible bucket and prefix for every service.
  AF_ARTIFACT_STORE: "${AF_ARTIFACT_STORE:-local}"
  AF_ARTIFACT_S3_BUCKET: "${AF_ARTIFACT_S3_BUCKET:-}"
  AF_ARTIFACT_S3_REGION: "${AF_ARTIFACT_S3_REGION:-us-east-1}"
  AF_ARTIFACT_S3_ENDPOINT: "${AF_ARTIFACT_S3_ENDPOINT:-}"
  AF_ARTIFACT_S3_PREFIX: "${AF_ARTIFACT_S3_PREFIX:-artifacts}"
  AF_ARTIFACT_S3_FORCE_PATH_STYLE: "${AF_ARTIFACT_S3_FORCE_PATH_STYLE:-0}"
  AF_ARTIFACT_S3_ALLOW_INSECURE_ENDPOINT: "${AF_ARTIFACT_S3_ALLOW_INSECURE_ENDPOINT:-0}"
  AF_ARTIFACT_S3_ACCESS_KEY_ID: "${AF_ARTIFACT_S3_ACCESS_KEY_ID:-}"
  AF_ARTIFACT_S3_SECRET_ACCESS_KEY: "${AF_ARTIFACT_S3_SECRET_ACCESS_KEY:-}"
  AF_ARTIFACT_S3_SESSION_TOKEN: "${AF_ARTIFACT_S3_SESSION_TOKEN:-}"
  AF_ARTIFACT_S3_REQUEST_TIMEOUT_MS: "${AF_ARTIFACT_S3_REQUEST_TIMEOUT_MS:-15000}"
  # Set one delivery mode: immutable public CDN URLs, or fresh private-bucket
  # presigned redirects generated by the gateway. Leave both empty for proxying.
  AF_ARTIFACT_PUBLIC_BASE_URL: "${AF_ARTIFACT_PUBLIC_BASE_URL:-}"
  AF_ARTIFACT_S3_PRESIGN_EXPIRES_SECONDS: "${AF_ARTIFACT_S3_PRESIGN_EXPIRES_SECONDS:-0}"
  AF_RESULT_TTL_SECONDS: "86400"
  # Request-scoped cancellation leases must outlive the longest queue wait and
  # worker wall timeout. They are bounded by Redis TTL and never contain source.
  AF_COMPILE_CONSUMER_TTL_SECONDS: "86400"
  AF_MAX_COMPILE_CONSUMERS_PER_JOB: "1024"
  AF_REDIS_COMMAND_TIMEOUT_MS: "1500"
  AF_MAX_JOB_EVENTS: "32"

x-worker-env: &worker-env
  <<: *common-env
  # This Compose project places every worker on one Docker host. Keep the
  # default at one compile for a conservative shared host; a dedicated worker
  # VM can set a unique ID and a measured capacity above one. This fallback is
  # only for this project's private Redis; an external shared Redis must use a
  # distinct AF_WORKER_HOST_ID on every physical worker host.
  AF_WORKER_HOST_ID: "${AF_WORKER_HOST_ID:-compose-shared-host}"
  AF_HOST_COMPILE_CAPACITY: "${AF_HOST_COMPILE_CAPACITY:-1}"
  AF_HOST_COMPILE_CAPACITY_WAIT_MS: "${AF_HOST_COMPILE_CAPACITY_WAIT_MS:-360000}"
  AF_TOOLCHAIN_PARALLELISM: "1"
  AF_MAX_EVENT_BYTES: "65536"
  AF_COMPILE_CANCEL_POLL_MS: "500"
  # Bound the worker-local Action cache independently from Redis retention.
  AF_ACTION_CACHE_TTL_SECONDS: "604800"
  AF_LOCAL_ACTION_CACHE_MAX_ENTRIES: "100000"
  AF_LOCAL_ACTION_CACHE_MAX_BYTES: "21474836480"
  AF_LOCAL_ACTION_CACHE_PRUNE_INTERVAL_MS: "300000"
  AF_PACK_CAS_TTL_SECONDS: "604800"
  AF_PACK_CAS_MAX_ENTRIES: "250000"
  AF_PACK_CAS_MAX_BYTES: "10737418240"
  AF_PACK_CAS_PRUNE_INTERVAL_MS: "300000"

x-worker: &worker
  restart: unless-stopped
  # A toolchain job may legitimately run for five minutes. Give BullMQ time
  # to finish the active job and publish its terminal event before Docker
  # escalates SIGTERM to SIGKILL during an update or host shutdown.
  stop_grace_period: 6m
  depends_on:
    redis:
      condition: service_healthy
  environment:
    <<: *worker-env
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
    - seccomp=unconfined
  pids_limit: 96
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=64m,uid=10001,gid=10001,mode=1777
    - /var/afwork:rw,nosuid,nodev,noexec,size=256m,uid=10001,gid=10001,mode=0700
  volumes:
    - artifacts:/var/afartifacts
    - type: volume
      source: libraries
      target: /var/aflibraries
      read_only: true
  networks: [backend]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 384mb
      - --maxmemory-policy
      - noeviction
    read_only: true
    cap_drop: [ALL]
    # The official Redis entrypoint initializes the named volume as root and
    # then drops to the redis UID. These are the minimum capabilities needed
    # for that one-time handoff; gateway and compiler workers keep ALL dropped.
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    cpus: 0.25
    mem_limit: 448m
    memswap_limit: 448m
    pids_limit: 64
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    image: sketchforge/gateway:production-v2
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *common-env
      HOST: 0.0.0.0
      PORT: "3000"
      # Keep proxy headers untrusted until the operator has configured a
      # reverse proxy that overwrites X-Forwarded-For. Set AF_TRUST_PROXY=1
      # only for that known, loopback-only proxy path.
      AF_TRUST_PROXY: "${AF_TRUST_PROXY:-0}"
      # Count limits bound scheduler work. The byte ledger below is shared by
      # all pools and bounds the actual UTF-8 request bodies held by BullMQ.
      AF_MAX_QUEUED_AVR: "150"
      AF_MAX_QUEUED_ESP32_XTENSA: "40"
      AF_MAX_QUEUED_ESP32_RISCV: "40"
      AF_MAX_QUEUED_REQUEST_BYTES: "100663296"
      # Terminal jobs retain compact metadata/results after workers strip source.
      AF_MAX_COMPLETED_JOBS_PER_POOL: "75"
      AF_FAILED_JOB_TTL_SECONDS: "3600"
      AF_MAX_FAILED_JOBS_PER_POOL: "25"
      # Anonymous project snapshots live in Redis and therefore need their own
      # cardinality and byte ceilings, independent from compile queue limits.
      AF_PROJECT_TTL_SECONDS: "2592000"
      AF_PROJECT_MAX_PER_VISITOR: "16"
      AF_PROJECT_VISITOR_MAX_BYTES: "4194304"
      AF_PROJECT_GLOBAL_MAX_BYTES: "67108864"
      AF_COMPILE_GLOBAL_RATE: "600"
      AF_COMPILE_IP_RATE: "120"
      AF_COMPILE_VISITOR_RATE: "60"
      AF_COMPILE_AVR_COST: "1"
      AF_COMPILE_ESP32_COST: "8"
      AF_MAX_SSE_CONNECTIONS: "256"
      AF_MAX_SSE_BUFFERED_BYTES: "4194304"
      AF_MAX_LIBRARY_IMPORTS: "1"
      AF_LIBRARY_IMPORT_WORK_DIR: /var/aflibrary-imports
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.50
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 96
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m,uid=10001,gid=10001,mode=1777
      - /var/aflibrary-imports:rw,nosuid,nodev,noexec,size=128m,uid=10001,gid=10001,mode=0700
    volumes:
      - artifacts:/var/afartifacts:ro
      - type: volume
        source: libraries
        target: /var/aflibraries
        read_only: false
    ports:
      - 127.0.0.1:${AF_GATEWAY_PORT:-3210}:3000
    networks: [backend, ingress]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  autoscaler:
    profiles: [autoscale]
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    image: sketchforge/gateway:production-v2
    command: [node, packages/server/dist/autoscale-cli.js]
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *common-env
      # This service only calculates desired replicas. The authenticated
      # orchestrator must place compiler workers on dedicated runsc/VM hosts.
      AF_AUTOSCALE_WEBHOOK_URL: "${AF_AUTOSCALE_WEBHOOK_URL:-}"
      AF_AUTOSCALE_WEBHOOK_TOKEN: "${AF_AUTOSCALE_WEBHOOK_TOKEN:-}"
      AF_AUTOSCALE_ALLOW_INSECURE_WEBHOOK: "${AF_AUTOSCALE_ALLOW_INSECURE_WEBHOOK:-0}"
      AF_AUTOSCALE_INTERVAL_MS: "${AF_AUTOSCALE_INTERVAL_MS:-10000}"
      AF_AUTOSCALE_REQUEST_TIMEOUT_MS: "${AF_AUTOSCALE_REQUEST_TIMEOUT_MS:-5000}"
      AF_AUTOSCALE_AVR_MIN_REPLICAS: "${AF_AUTOSCALE_AVR_MIN_REPLICAS:-1}"
      AF_AUTOSCALE_AVR_MAX_REPLICAS: "${AF_AUTOSCALE_AVR_MAX_REPLICAS:-20}"
      AF_AUTOSCALE_ESP32_XTENSA_MIN_REPLICAS: "${AF_AUTOSCALE_ESP32_XTENSA_MIN_REPLICAS:-1}"
      AF_AUTOSCALE_ESP32_XTENSA_MAX_REPLICAS: "${AF_AUTOSCALE_ESP32_XTENSA_MAX_REPLICAS:-10}"
      AF_AUTOSCALE_ESP32_RISCV_MIN_REPLICAS: "${AF_AUTOSCALE_ESP32_RISCV_MIN_REPLICAS:-1}"
      AF_AUTOSCALE_ESP32_RISCV_MAX_REPLICAS: "${AF_AUTOSCALE_ESP32_RISCV_MAX_REPLICAS:-10}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.20
    mem_limit: 192m
    memswap_limit: 192m
    pids_limit: 64
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,uid=10001,gid=10001,mode=1777
    networks: [backend, ingress]
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  worker-avr:
    <<: *worker
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker-avr
      target: "${AF_AVR_IMAGE_TARGET:-final}"
      args:
        AF_COMPILER_BUNDLE_ID: "${AF_COMPILER_BUNDLE_ID:-sketchforge-production-v2}"
        AF_PREWARM_BOARDS: "${AF_PREWARM_AVR_BOARDS:-}"
    image: sketchforge/worker-avr:production-v2
    cpus: 0.75
    mem_limit: 640m
    memswap_limit: 640m
    volumes:
      - artifacts:/var/afartifacts
      - avr-cache:/var/afcache
      - type: volume
        source: libraries
        target: /var/aflibraries
        read_only: true

  worker-esp32-xtensa:
    <<: *worker
    profiles: [esp32-xtensa]
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker-esp32
      target: "${AF_ESP32_IMAGE_TARGET:-final}"
      args:
        TARGET_FAMILY: xtensa
        AF_COMPILER_BUNDLE_ID: "${AF_COMPILER_BUNDLE_ID:-sketchforge-production-v2}"
        AF_PREWARM_BOARDS: "${AF_PREWARM_XTENSA_BOARDS:-}"
        AF_PREWARM_MATRIX: "${AF_PREWARM_MATRIX:-all}"
    image: sketchforge/worker-esp32-xtensa:3.3.7-v2
    cpus: 1.0
    mem_limit: 1280m
    memswap_limit: 1280m
    environment:
      <<: *worker-env
      AF_JOB_WALL_TIMEOUT_MS: "300000"
    volumes:
      - artifacts:/var/afartifacts
      - esp32-xtensa-cache:/var/afcache
      - type: volume
        source: libraries
        target: /var/aflibraries
        read_only: true

  worker-esp32-riscv:
    <<: *worker
    profiles: [esp32-riscv]
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker-esp32
      target: "${AF_ESP32_IMAGE_TARGET:-final}"
      args:
        TARGET_FAMILY: riscv
        AF_COMPILER_BUNDLE_ID: "${AF_COMPILER_BUNDLE_ID:-sketchforge-production-v2}"
        AF_PREWARM_BOARDS: "${AF_PREWARM_RISCV_BOARDS:-}"
        AF_PREWARM_MATRIX: "${AF_PREWARM_MATRIX:-all}"
    image: sketchforge/worker-esp32-riscv:3.3.7-v2
    cpus: 1.0
    mem_limit: 1280m
    memswap_limit: 1280m
    environment:
      <<: *worker-env
      AF_JOB_WALL_TIMEOUT_MS: "300000"
    volumes:
      - artifacts:/var/afartifacts
      - esp32-riscv-cache:/var/afcache
      - type: volume
        source: libraries
        target: /var/aflibraries
        read_only: true

networks:
  backend:
    internal: true
  # The gateway needs a routable interface for the loopback-published port.
  # Keeping it separate means Redis and compiler workers remain unreachable
  # from the host-facing network.
  ingress:
    driver: bridge

volumes:
  redis-data:
  artifacts:
  libraries:
  avr-cache:
  esp32-xtensa-cache:
  esp32-riscv-cache:
